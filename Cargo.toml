[package]
name = "aoe4_replay_launcher"
version = "0.1.2"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
flate2 = "1.0"
self_update = { version = "1.3.0", default-features = false, features = ["ureq", "native-tls", "github", "archive-zip", "compression-zip-deflate", "checksums"] }
semver = "1"
tempfile = "3.27.0"
fs2 = "0.4.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
