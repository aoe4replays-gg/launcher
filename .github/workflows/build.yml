name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "V*"
    paths:
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - MANUAL.txt
      - .github/workflows/build.yml
  pull_request:
    paths:
      - "src/**"
      - Cargo.toml
      - Cargo.lock
      - MANUAL.txt
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: aoe4-replay-launcher-linux-x86_64
            executable: target/release/aoe4_replay_launcher
          - name: Windows x86_64
            os: windows-latest
            artifact: aoe4-replay-launcher-windows-x86_64
            executable: target/release/aoe4_replay_launcher.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release --locked

      - name: Test launcher
        run: cargo test --locked

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (& '${{ matrix.executable }}' --version).Trim()
          if ($env:RELEASE_TAG -cne "v$version") { throw "Release tag must be v$version" }

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package -Force | Out-Null
          Copy-Item -LiteralPath '${{ matrix.executable }}', 'MANUAL.txt' -Destination release-package -ErrorAction Stop

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: aoe4-replay-launcher-*
          path: artifacts

      - name: Create release ZIPs
        run: |
          chmod +x artifacts/aoe4-replay-launcher-linux-x86_64/aoe4_replay_launcher
          zip -j aoe4-replay-launcher-linux-x86_64.zip artifacts/aoe4-replay-launcher-linux-x86_64/*
          zip -j aoe4-replay-launcher-windows-x86_64.zip artifacts/aoe4-replay-launcher-windows-x86_64/*
          sha256sum aoe4-replay-launcher-*.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            aoe4-replay-launcher-linux-x86_64.zip \
            aoe4-replay-launcher-windows-x86_64.zip \
            SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
